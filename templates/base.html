<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="900"><title>{% block title %}CL{% endblock %}</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7fafc;color:#1a202c;overflow-y:hidden}
.navbar{display:flex;flex-direction:column;background:#1a202c;color:#fff}
.nav-top-row,.nav-bottom-row{display:flex;justify-content:space-between;align-items:center;padding:.5rem 1rem}
.nav-top-row{border-bottom:1px solid #2d3748}
.nav-sub-row{display:flex;justify-content:flex-end;padding:.35rem 1rem;border-bottom:1px solid #2d3748;background:#202938}
.nav-left,.nav-sub-right,.weather-metrics{display:flex;align-items:center;list-style:none;margin:0;padding:0;gap:1rem}
.nav-left h1{margin:0;font-size:1.1rem}
.nav-left a,.nav-sub-right a{color:#cbd5e0;text-decoration:none}
.nav-left a:hover,.nav-sub-right a:hover{color:#fff}
.nav-left li.active>a{color:#63b3ed;font-weight:700}
.nav-sub-right{font-size:.9rem}
.weather-badge{background:#2d3748;padding:.2rem .5rem;border-radius:4px;font-size:.8rem}
.content{width:100%;max-width:none;margin:0;padding:1.25rem;min-width:0}
a{color:#3182ce}.card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:1rem;margin:.75rem 0}.meta{color:#666;font-size:.9rem}.price{font-weight:700}.card img{display:block;max-width:100%;height:auto;margin:0 auto;border-radius:4px}form.inline{display:inline}.status-badge{display:inline-block;padding:.2rem .55rem;border-radius:999px;font-size:.8rem;font-weight:700;line-height:1.3}.status-published{background:#e8edf2;color:#3f4a56}.status-pending{background:#fff1d6;color:#754600}.status-completed{background:#dff3e7;color:#155c35}table{width:100%;border-collapse:collapse;background:#fff}td,th{padding:.6rem;border-bottom:1px solid #ddd;text-align:left}input,select,button{font:inherit;padding:.45rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.5rem}.notice{padding:.75rem;background:#fff;border:1px solid #ddd;border-radius:6px;margin:.5rem 0}body.control-panel-page{width:98%;max-width:none;box-sizing:border-box}.control-panel-page .grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr),1fr)}.control-panel-page .grid>label{min-width:0}.control-panel-page .grid input:not([type=checkbox]),.control-panel-page .grid select{box-sizing:border-box;width:100%;min-width:0;max-width:100%}
@media(max-width:800px){.nav-bottom-row{flex-direction:column;align-items:flex-start;gap:.5rem}.weather-metrics{flex-wrap:wrap;gap:.4rem}.nav-sub-row{justify-content:flex-start;overflow-x:auto}.content{padding:.9rem}}
</style></head>
<body class="{% block body_class %}{% endblock %}">
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="notice">{{ message }}</div>{% endfor %}{% endwith %}
<main class="content">{% block content %}{% endblock %}</main>
<script>
(() => {
  const sendHeight = () => {
    const height = Math.max(
      document.documentElement.scrollHeight,
      document.body.scrollHeight,
      document.documentElement.offsetHeight,
      document.body.offsetHeight
    );
    window.parent.postMessage({ type: "localsonly-height", height }, "*");
  };
  window.addEventListener("load", sendHeight);
  window.addEventListener("resize", sendHeight);
  window.addEventListener("message", (event) => {
    if (event.data?.type === "localsonly-request-height") sendHeight();
  });
  if (window.ResizeObserver) new ResizeObserver(sendHeight).observe(document.body);
  sendHeight();
})();
</script>
</body></html>
